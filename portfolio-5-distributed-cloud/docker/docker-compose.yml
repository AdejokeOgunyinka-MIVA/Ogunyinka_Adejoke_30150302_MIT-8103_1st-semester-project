# =====================================================================
# Cartify: PostgreSQL streaming replication, one primary + one replica
# Portfolio 5 - Distributed and Cloud Database Exercise
#
# Start:   docker compose -f portfolio-5-distributed-cloud/docker/docker-compose.yml up -d
# Stop:    docker compose -f portfolio-5-distributed-cloud/docker/docker-compose.yml down -v
#
# primary  listens on localhost:5433  (read-write)
# replica  listens on localhost:5434  (read-only, follows primary)
# Ports 5433/5434 avoid clashing with the native PostgreSQL on 5432.
# =====================================================================
services:

  primary:
    image: postgres:17
    container_name: cartify-primary
    environment:
      POSTGRES_PASSWORD: cartify_pass
      POSTGRES_DB: cartify
    ports:
      - "5433:5432"
    volumes:
      - ./init-primary.sh:/docker-entrypoint-initdb.d/init-primary.sh:ro
      - primary-data:/var/lib/postgresql/data
    # Replication settings. wal_level=replica makes the write-ahead log
    # detailed enough for a standby to replay it.
    command: >
      postgres
        -c wal_level=replica
        -c max_wal_senders=5
        -c wal_keep_size=256MB
        -c hot_standby=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cartify"]
      interval: 3s
      timeout: 3s
      retries: 20

  replica:
    image: postgres:17
    container_name: cartify-replica
    depends_on:
      primary:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: cartify_pass
      PGPASSWORD: replicator_pass
    ports:
      - "5434:5432"
    volumes:
      - replica-data:/var/lib/postgresql/data
    user: postgres
    # On first start: clone the primary with pg_basebackup. The -R flag
    # writes standby.signal and primary_conninfo, which is what turns a
    # clone into a streaming replica. On later starts the data directory
    # already exists, so it just starts PostgreSQL in standby mode.
    command: >
      bash -c "
        if [ ! -s \"$$PGDATA/PG_VERSION\" ]; then
          echo 'Replica: cloning primary with pg_basebackup...';
          pg_basebackup -h primary -p 5432 -U replicator -D \"$$PGDATA\" -Fp -Xs -R -P;
          chmod 0700 \"$$PGDATA\";
          echo 'Replica: clone complete';
        fi;
        exec postgres -c hot_standby=on
      "

volumes:
  primary-data:
  replica-data:
